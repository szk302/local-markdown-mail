[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }
actionlint = "1.7.12"
# Used by actionlint to check `run:` scripts (same result locally and in CI).
shellcheck = "0.11.0"

[tasks.build]
description = "Build lmm"
run = "cargo build --locked"

[tasks.test]
description = "Run all tests"
run = "cargo test --locked"

[tasks.lint]
description = "Run rustfmt check, clippy and actionlint"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "actionlint",
]

[tasks.fmt]
description = "Format sources"
run = "cargo fmt --all"
