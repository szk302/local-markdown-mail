[package]
name = "lmm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
saphyr-parser = "=0.1.0"
serde_json = { version = "=1.0.152", features = ["preserve_order", "arbitrary_precision"] }
signal-hook = "=0.4.5"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[dev-dependencies]
assert_cmd = "=2.2.2"
libc = "=0.2.190"
predicates = "=3.1.4"
serde_json = "=1.0.152"
tempfile = "=3.27.0"
