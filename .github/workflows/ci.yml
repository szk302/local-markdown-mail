name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install jq (used by the hook example test)
        if: runner.os == 'Linux'
        run: command -v jq || sudo apt-get install -y jq
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
