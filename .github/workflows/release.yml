name: Release

# Push a tag like `v0.1.0` (matching `version` in Cargo.toml, on a commit
# already merged into main) to build the binaries and publish them as a
# GitHub Release. Tags with a `-` (e.g. `v0.2.0-rc.1`) become prereleases.
# Run manually (workflow_dispatch) to build and test without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_ABOUT_VERSION: "0.9.2"
  CARGO_ABOUT_SHA256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af" # x86_64-unknown-linux-musl

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: false

      - name: Read the version from Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lmm") | .version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: ${version}"

      - name: Check the tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi
          # Only release commits that went through review on main.
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"
            exit 1
          fi

      - name: Install cargo-about
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "$GITHUB_PATH"

      - name: Generate third-party license notices
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notices
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Last GitHub-hosted x86_64 macOS image (available until Aug 2027).
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: false

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Show the toolchain
        run: |
          rustc -vV
          cargo -V

      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notices

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: "1" # no AppleDouble (._*) files from bsdtar
        run: |
          name="lmm-v${VERSION}-${TARGET}"
          dir="dist/${name}"
          mkdir -p "${dir}"
          cp "target/${TARGET}/release/lmm" README.md LICENSE THIRD-PARTY-LICENSES.txt "${dir}/"
          case "${TARGET}" in
            *-linux-musl) cp licenses/MUSL-COPYRIGHT "${dir}/" ;;
          esac
          "${dir}/lmm" --version
          if [ "$(uname -s)" = Darwin ]; then
            lipo -archs "${dir}/lmm"
            tar -C dist -czf "dist/${name}.tar.gz" --uid 0 --gid 0 --uname root --gname root "${name}"
          else
            tar -C dist -czf "dist/${name}.tar.gz" --owner=0 --group=0 --numeric-owner "${name}"
          fi
          tar -tzvf "dist/${name}.tar.gz"
          echo "ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: "*-*-*"
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${flags[@]}" \
            dist/*.tar.gz dist/SHA256SUMS
